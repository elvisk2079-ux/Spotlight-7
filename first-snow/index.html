let partIndex=0,flashIndex=0,flipped=false;
const KEY="first-snow-long-scroll-v2";
let solved={};try{solved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(solved))}catch(e){}};
const make=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9' ]/g,"").replace(/\s+/g," ").trim();
const item=()=>PARTS[partIndex].items;
const exs=()=>DRILLS.filter(x=>x.p===partIndex);
function refreshProgress(){
const all=exs(),total=all.reduce((s,e)=>s+e.records.length,0);let done=0;
const dots=document.getElementById("dots");dots.replaceChildren();
all.forEach((e,ei)=>{let n=e.records.filter((r,ri)=>solved[partIndex+"-"+ei+"-"+ri]).length;done+=n;const d=make("div","dot"+(n===e.records.length?" done":n>0?" active":""));d.title=e.title+" — "+n+"/"+e.records.length;d.style.width="10px";dots.append(d)});
document.getElementById("progressText").textContent=done+" / "+total+" ответов";
}
function tabs(){const t=document.getElementById("tabs");t.replaceChildren();PARTS.forEach((x,i)=>{const b=make("button","tab",(i+1)+". "+x.title);b.setAttribute("role","tab");b.setAttribute("aria-selected",String(i===partIndex));b.onclick=()=>{partIndex=i;flashIndex=0;flipped=false;render();window.scrollTo(0,0)};t.append(b)})}
function flashcards(root){const wrap=make("section","box cards");wrap.append(make("div","sectionlabel","🔊 Карточки · произношение только здесь"),make("p","small muted","Нажми на карточку, чтобы перевернуть. Нажми Listen для английского произношения."));
const flip=make("button","flash");const count=make("span","counter");
function update(){flip.replaceChildren(make("div","",item()[flashIndex][flipped?1:0]),make("small","",flipped?"Нажми, чтобы увидеть английский":"Нажми, чтобы увидеть перевод"));flip.classList.toggle("back",flipped);count.textContent=(flashIndex+1)+" / "+item().length}
flip.onclick=()=>{flipped=!flipped;update()};update();wrap.append(flip);
const bar=make("div","toolbar");const prev=make("button","btn","←");prev.onclick=()=>{flashIndex=(flashIndex+item().length-1)%item().length;flipped=false;update()};
const speak=make("button","btn","🔊 Listen");speak.onclick=()=>{if(!("speechSynthesis"in window)){alert("Озвучка в этом браузере недоступна.");return}speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(item()[flashIndex][0]);utter.lang="en-GB";utter.rate=.86;speechSynthesis.speak(utter)};
const next=make("button","btn","→");next.onclick=()=>{flashIndex=(flashIndex+1)%item().length;flipped=false;update()};bar.append(prev,speak,next,count);wrap.append(bar);root.append(wrap)}
function exercise(root,ex,ei){const box=make("section","box exercise");box.id="exercise-"+ei;let head=make("div","exhead");head.append(make("div","",String(ei+1).padStart(2,"0")+" · "+ex.title),make("span","excount",ex.records.length+" предложений"));box.append(make("p","sectionlabel","Практика "+(ei+1)+" / 8"),head,make("p","small muted",ex.help));
ex.records.forEach((r,ri)=>{const key=partIndex+"-"+ei+"-"+ri,card=make("div","qcard"),num=make("div","small muted","Предложение "+(ri+1)+" / "+ex.records.length);
card.append(num);
let prompt=r.q,answer=r.answer;
if(ex.type==="gap"||ex.type==="gap2"){const q=item()[r.i][0];const at=prompt.toLowerCase().indexOf(q.toLowerCase());if(at>=0)prompt=prompt.substring(0,at)+"________"+prompt.substring(at+q.length);else prompt=r.q+"  →  ________"}
card.append(make("p","qtitle",prompt));if(r.ru&&(ex.type==="gap"||ex.type==="gap2"))card.append(make("p","qru",r.ru));
const feedback=make("div","feedback");feedback.hidden=true;
const controls=make("div","toolbar");
function resolve(ok,model){if(solved[key])return;solved[key]={ok:!!ok};save();feedback.hidden=false;feedback.className="feedback "+(ok?"ok":"bad");feedback.textContent=ok?"✓ Верно!":"Правильный ответ: "+model;refreshProgress();card.querySelectorAll("input,textarea,button").forEach(b=>b.disabled=true);if(!ok){const retry=make("button","btn small","Повторить");retry.disabled=false;retry.onclick=()=>{delete solved[key];save();render();document.getElementById("exercise-"+ei).scrollIntoView({block:"start"})};feedback.append(" ",retry)}}
if(["mc-en","mc-ru","mc-word"].includes(ex.type)){
const pool=ex.records.filter(x=>x.i!==r.i);
let answers=shuffle([answer,...shuffle(pool).slice(0,3).map(x=>ex.type==="mc-word"?item()[x.i][0]:x.answer)]);
const choices=make("div","choices");
answers.forEach(v=>{const b=make("button","choice",v);b.onclick=()=>{const ok=v===answer;b.classList.add(ok?"ok":"bad");resolve(ok,answer)};choices.append(b)});card.append(choices)
}else if(ex.type==="order"){
const words=answer.replace(/[.!?]$/,"").split(/\s+/),tiles=shuffle(words.map((word,i)=>({word,i}))),chosen=[];
const pick=make("div","selectedWords words"),available=make("div","words");
function draw(){pick.replaceChildren();available.replaceChildren();chosen.forEach((w,i)=>{let b=make("button","word",w.word);b.onclick=()=>{chosen.splice(i,1);draw()};pick.append(b)});tiles.filter(t=>!chosen.includes(t)).forEach(w=>{let b=make("button","word",w.word);b.onclick=()=>{chosen.push(w);draw()};available.append(b)})}draw();
card.append(pick,available);const check=make("button","btn primary","Проверить");check.onclick=()=>resolve(norm(chosen.map(w=>w.word).join(" "))===norm(answer),answer);controls.append(check)
}else{
const field=ex.type==="type"?make("textarea","ans"):make("input","ans");field.setAttribute("aria-label","Английский ответ");field.setAttribute("autocomplete","off");field.setAttribute("spellcheck","false");field.placeholder=ex.type==="type"?"Напиши предложение целиком":"Впиши слово или выражение";card.append(field);
const expected=ex.type==="gap"||ex.type==="gap2"?item()[r.i][0]:answer;
const check=make("button","btn primary","Проверить");check.onclick=()=>{if(!field.value.trim())return;const ok=norm(field.value)===norm(expected);field.classList.add(ok?"ok":"bad");resolve(ok,expected)};controls.append(check);
field.addEventListener("keydown",e=>{if(e.key==="Enter"&&ex.type!=="type"){e.preventDefault();check.click()}})
}
const show=make("button","btn","Показать ответ");show.onclick=()=>resolve(false,ex.type==="gap"||ex.type==="gap2"?item()[r.i][0]:answer);controls.append(show);card.append(controls,feedback);
if(solved[key]){feedback.hidden=false;feedback.className="feedback "+(solved[key].ok?"ok":"bad");feedback.textContent=solved[key].ok?"✓ Выполнено правильно":"Ответ: "+(ex.type==="gap"||ex.type==="gap2"?item()[r.i][0]:answer);card.querySelectorAll("button,input,textarea").forEach(b=>b.disabled=true)}
box.append(card)});
const reset=make("button","btn","↻ Повторить эту тренировку");reset.onclick=()=>{ex.records.forEach((_,ri)=>delete solved[partIndex+"-"+ei+"-"+ri]);save();render();document.getElementById("exercise-"+ei).scrollIntoView({block:"start"})};box.append(reset);root.append(box)}
